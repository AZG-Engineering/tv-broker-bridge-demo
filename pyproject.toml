[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tv-broker-bridge"
version = "0.1.0"
description = "TradingView-webhook-to-broker bridge demo: idempotent, risk-gated, reconciled order handling (paper trading only)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AZG Engineering" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx2",  # Starlette >=1.x TestClient prefers it over httpx
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
tv-bridge = "tv_broker_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tv_broker_bridge = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "S", "N", "PL", "TRY", "RET"]
ignore = [
    "PLR0913",  # many-argument constructors are normal for dependency wiring
    "PLR2004",  # magic values are fine in tests and small thresholds
    "TRY003",   # descriptive messages inline are fine
    "PLR0911",  # early returns keep decision code flat
    "PLR0912",
    "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR", "N802", "S311", "RUF012", "TRY"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
